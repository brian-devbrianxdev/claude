# Bug-lifecycle workflow. Same shape as ticket.yaml with two differences: analyze is replaced by
# bug-investigation (root-cause diagnosis first), and test's regression-test requirement is
# mandatory rather than conditional. See ../nodes/*.md for full contracts, ../README.md for how to
# read this file, and ../../refactor/design.md §4 for the routing rationale.

workflow: bugfix
description: >
  Use when the ticket's Jira issue type is Bug, or the user says "investigate"/"why does this
  fail"/"root cause" before any fix is proposed.
extends: ticket.yaml

nodes:
  - id: intake
    node_contract: ../nodes/intake.md
    always: true
    dependencies: []

  - id: analyze
    node_contract: ../nodes/analyze.md
    maps_to_instead: bug-investigation   # ../../skills/bug-investigation/SKILL.md — read-only root-cause diagnosis
    always: true
    dependencies: [intake]
    note: >
      bug-investigation explicitly hands off rather than applying a fix itself
      ("Applying a fix — that's /ship-task, not this skill"). Its hypothesis and reproduction
      steps become implement's input, recorded in state.decisions[].

  - id: plan
    node_contract: ../nodes/plan.md
    dependencies: [analyze]
    when:
      any_of:
        - fix_direction_has_multiple_viable_options   # bug-investigation found >1 candidate fix
        - user_explicitly_requested_estimate

  - id: implement
    node_contract: ../nodes/implement.md
    always: true
    dependencies: [analyze]
    after: [plan]
    fan_out:
      by: repo
      source: state.repos[]

  - id: integrate
    node_contract: ../nodes/integrate.md
    dependencies: [implement]
    when:
      all_of:
        - repos_count_gte: 2
        - cross_repo_contract_touched

  - id: test
    node_contract: ../nodes/test.md
    always: true
    dependencies: [implement]
    after: [integrate]
    regression_test_mandatory: true
    note: >
      rules/testing.md: "a bug fix needs a regression test at the lowest reliable layer that
      fails before the fix." This is non-negotiable for the bugfix workflow — test's
      success_criteria cannot be met without it, unlike the feature workflow where it's only
      required for a "Bug fix" change type.

  - id: review
    node_contract: ../nodes/review.md
    always: true
    dependencies: [implement]
    after: [integrate]

  - id: security
    node_contract: ../nodes/security.md
    dependencies: [implement]
    when:
      any_of:
        - input_handling_touched
        - query_or_persistence_touched
        - auth_or_jwt_or_rate_limit_touched

  - id: ship
    node_contract: ../nodes/ship.md
    always: true
    dependencies: [test, review]
    human_gate: true
